<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapCut Pro - Secure Download</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #00f2ea;
        --secondary: #ff0050;
        --warning: #ffc107;
        --bg-dark: #0f0f1a;
        --card-bg: rgba(255, 255, 255, 0.05);
        --text-main: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(255, 0, 80, 0.15) 0%, transparent 40%);
        display: flex;
        flex-direction: column; /* উপর-নিচ সাজানোর জন্য */
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-main);
        padding: 20px;
    }

    /* নির্দেশনা বক্স (নতুন সংযোজন) */
    .instruction-box {
        background: rgba(255, 193, 7, 0.1);
        border-left: 4px solid var(--warning);
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 25px;
        width: 100%;
        max-width: 380px;
        backdrop-filter: blur(10px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        animation: fadeIn 1s ease-in-out;
    }

    .instruction-box h3 {
        font-family: 'Hind Siliguri', sans-serif;
        color: var(--warning);
        font-size: 18px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .instruction-box ul {
        list-style: none;
    }

    .instruction-box li {
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 14px;
        color: #e0e0e0;
        margin-bottom: 5px;
        line-height: 1.6;
    }
    
    .instruction-box li i {
        color: var(--warning);
        margin-right: 5px;
        font-size: 10px;
    }

    /* মেইন কার্ড ডিজাইন */
    .download-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px 30px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        text-align: center;
        max-width: 380px;
        width: 100%;
        position: relative;
    }

    .badge {
        background: rgba(0, 242, 234, 0.1);
        color: var(--primary);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 242, 234, 0.2);
    }

    .app-icon-wrapper {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
    }
    
    .app-icon {
        width: 100%;
        height: 100%;
        border-radius: 22px;
        object-fit: cover;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    
    .verified-icon {
        position: absolute;
        bottom: -5px;
        right: -5px;
        background: #fff;
        color: #1DA1F2;
        border-radius: 50%;
        padding: 4px;
        font-size: 14px;
        border: 2px solid var(--bg-dark);
    }

    h2 { font-size: 22px; margin-bottom: 5px; font-weight: 700; }

    .meta-info {
        color: #b3b3b3;
        font-size: 13px;
        margin-bottom: 30px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }
    .meta-info span i { margin-right: 5px; color: var(--primary); }

    .btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s ease;
        text-decoration: none;
        margin-bottom: 15px;
    }

    #unlockBtn {
        background: linear-gradient(135deg, #ff0050, #ff416c);
        color: white;
        box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
    }
    
    #unlockBtn:hover { transform: translateY(-2px); }

    #downloadBtn {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: not-allowed;
        pointer-events: none;
    }

    #downloadBtn.active {
        background: linear-gradient(135deg, #00f2ea, #00c6fb);
        color: #000;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 8px 20px rgba(0, 242, 234, 0.3);
        animation: pulse 2s infinite;
    }

    /* Progress Bar */
    .progress-container {
        width: 100%;
        background-color: rgba(255,255,255,0.1);
        border-radius: 10px;
        height: 6px;
        margin-bottom: 10px;
        display: none;
        overflow: hidden;
    }
    .progress-bar {
        height: 100%;
        background: var(--primary);
        width: 0%;
        border-radius: 10px;
        transition: width 0.1s linear;
    }
    
    .status-text {
        font-size: 12px;
        color: var(--primary);
        margin-bottom: 15px;
        display: none;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 242, 234, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(0, 242, 234, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 242, 234, 0); }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<!-- নির্দেশনা বক্স (বাংলায়) -->
<div class="instruction-box">
    <h3><i class="fas fa-exclamation-triangle"></i> ডাউনলোড করার নিয়ম</h3>
    <ul>
        <li><i class="fas fa-circle"></i> ১. প্রথমে <b>Watch Ad to Unlock</b> বাটনে ক্লিক করুন।</li>
        <li><i class="fas fa-circle"></i> ২. পেজটি লোড হওয়া পর্যন্ত <b>কয়েক সেকেন্ড</b> অপেক্ষা করুন।</li>
        <li><i class="fas fa-circle"></i> ৩. এরপর <b>Download</b> বাটনটি আনলক হবে।</li>
    </ul>
</div>

<!-- মেইন ডাউনলোড কার্ড -->
<div class="download-card">
    <div class="badge">MOD PREMIUM UNLOCKED</div>
    
    <div class="app-icon-wrapper">
        <img src="https://raw.githubusercontent.com/ainulbhaix/capcut/main/capcut.jpg" alt="CapCut" class="app-icon">
        <i class="fas fa-check-circle verified-icon"></i>
    </div>
    
    <h2>CapCut Pro</h2>
    <div class="meta-info">
        <span><i class="fas fa-star"></i> 4.9</span>
        <span><i class="fas fa-download"></i> 100M+</span>
        <span><i class="fas fa-hdd"></i> 180MB</span>
    </div>

    <!-- বাটন ১ -->
    <button id="unlockBtn" class="btn" onclick="startUnlockProcess()">
        <i class="fas fa-play"></i> Watch Ad to Unlock 🔓
    </button>

    <!-- প্রসেস বার -->
    <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <p id="statusMsg" class="status-text">Verifying advertisement...</p>

    <!-- বাটন ২ -->
    <a id="downloadBtn" class="btn" href="#">
        <i class="fas fa-lock"></i> Download Free
    </a>
</div>

<script>
    // ==========================================
    // সেটআপ সেকশন
    // ==========================================
    
    const adsterraLink = "http://t.me/AbFileLinkBot/ads"; // আপনার Adsterra Direct Link দিন
    const fileDownloadLink = "https://t.me/ABcapCutPro/12"; // আসল ডাউনলোড লিংক
    const waitTime = 5000; // ৫০০০ = ৫ সেকেন্ড

    // ==========================================
    // মেইন লজিক কোড
    // ==========================================
    
    function startUnlockProcess() {
        const unlockBtn = document.getElementById('unlockBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMsg = document.getElementById('statusMsg');

        // নতুন ট্যাবে অ্যাড ওপেন
        window.open(adsterraLink, '_blank');

        // UI চেঞ্জ
        unlockBtn.style.opacity = "0.7";
        unlockBtn.style.pointerEvents = "none";
        unlockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
        
        progressContainer.style.display = "block";
        statusMsg.style.display = "block";

        // টাইমার সেটআপ
        let width = 0;
        const intervalTime = waitTime / 100;
        
        const timer = setInterval(() => {
            if (width >= 100) {
                clearInterval(timer);
                unlockCompleted();
            } else {
                width++;
                progressBar.style.width = width + '%';
            }
        }, intervalTime);
    }

    function unlockCompleted() {
        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const statusMsg = document.getElementById('statusMsg');

        unlockBtn.style.display = "none";
        progressContainer.style.display = "none";
        statusMsg.style.display = "none";

        downloadBtn.classList.add('active');
        downloadBtn.href = fileDownloadLink;
        downloadBtn.target = "_blank";
        downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download Pro Apk';
    }
</script>

</body>
</html>
